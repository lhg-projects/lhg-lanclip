name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: go build ./...
      # clipboard/darwin uses cgo AppKit; cross-compile checks are done on
      # matching OS runners above, plus a windows/amd64 binary artifact.
      - name: Vet
        run: go vet ./...

  release-binary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Cross-compile windows binary (smoke)
        run: GOOS=windows GOARCH=amd64 go build -o dist/lanclip-windows-amd64.exe ./cmd/lanclip
      - uses: actions/upload-artifact@v4
        with:
          name: lanclip-windows-amd64
          path: dist/
